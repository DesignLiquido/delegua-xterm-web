<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="/css/estilos.css" />

    <script src="js/delegua-xterm-web.js"></script>
    <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="/js/comandos.js"></script>
    <script src="/js/await-notify.js"></script>
  </head>
  <body>
    <div id="terminal"></div>
    <script>
      var term = new Terminal({
        rows: 50,
        fontFamily: '"Cascadia Code", Menlo, monospace',
        allowProposedApi: true,
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);

      const delegua = window.DeleguaTerminal;
      var comando = "";
      var cursorPos = 0;
      var resultadoLeia = "";
      var modoDelegua = false;
      var modoAjuda = false;
      var comandoLeia = false;
      var promessaLeitura = new window.Subject();

      const lexador = new delegua.Lexador();
      const avaliadorSintatico = new delegua.AvaliadorSintatico();
      const interpretador = delegua.criarInterpretador((t) => term.write(t + "\r\n"), (t) => term.write(t));
      interpretador.interfaceEntradaSaida = {
        question: (mensagem, callback) => {
          comandoLeia = true;
          term.write(mensagem);
          promessaLeitura.wait().then(_ => {
            const copiaResultadoLeia = resultadoLeia;
            resultadoLeia = "";
            callback(copiaResultadoLeia);
          });
        }
      }

      // Persist parser scope across LAIR calls so variables declared in one line
      // are visible to the parser in subsequent lines.
      const escopoSintaticoPersistente = {};
      const _inicializarPilhaOriginal = avaliadorSintatico.inicializarPilhaEscopos.bind(avaliadorSintatico);
      avaliadorSintatico.inicializarPilhaEscopos = function() {
        _inicializarPilhaOriginal();
        for (const [nome, info] of Object.entries(escopoSintaticoPersistente)) {
          this.pilhaEscopos.definirInformacoesVariavel(nome, info);
        }
      };

      async function executarInstrucaoDelegua(terminal, linha) {
        const resultadoLexador = lexador.mapear([linha], -1);
        const resultadoAvaliacaoSintatica = await avaliadorSintatico.analisar(resultadoLexador);
        if (resultadoAvaliacaoSintatica.erros.length > 0) {
          for (const erro of resultadoAvaliacaoSintatica.erros) {
            terminal.write((erro.erroInterno?.message ?? String(erro)) + "\r\n");
          }
          deleguaPrompt(terminal);
          return;
        }
        // Save parser scope so future LAIR lines see variables declared here.
        if (avaliadorSintatico.pilhaEscopos?.pilha?.length > 0) {
          Object.assign(escopoSintaticoPersistente, avaliadorSintatico.pilhaEscopos.pilha[0].elementosSintaticos);
        }
        interpretador.interpretar(
          resultadoAvaliacaoSintatica.declaracoes,
          true
        ).then(retornoInterpretador => {
          if (retornoInterpretador.erros.length > 0) {
            for (const erro of retornoInterpretador.erros) {
              terminal.write((erro.erroInterno?.message ?? String(erro.erroInterno)) + "\r\n");
            }
          } else if (retornoInterpretador.resultado.length > 0) {
            const primeiroResultado = retornoInterpretador.resultado[0];
            const valorRetornado = primeiroResultado?.valorRetornado ?? primeiroResultado;

            if (valorRetornado?.__modoAjuda === true) {
              modoAjuda = true;
              exibirBoasVindasAjuda(terminal);
              ajudaPrompt(terminal);
              return;
            }

            if (valorRetornado?.__conteudoAjuda === true) {
              const conteudo = buscarConteudoAjuda(valorRetornado.topico);
              if (conteudo) {
                terminal.write(aplicarRealceSintaxeWeb(conteudo).replace(/\n/g, '\r\n'));
              } else {
                terminal.writeln('\x1b[31mNenhuma ajuda disponível para "' + valorRetornado.topico + '".\x1b[0m');
              }
              deleguaPrompt(terminal);
              return;
            }

            if (primeiroResultado?.tipo !== 'vazio') {
              const valor = primeiroResultado?.valorRetornado?.valor ?? primeiroResultado?.valor;
              if (valor !== undefined && valor !== null) {
                terminal.write(String(valor) + "\r\n");
              }
            }
          }

          deleguaPrompt(terminal);
        });
      }

      term.open(document.getElementById("terminal"));
      fitAddon.fit();

      function terminalPrompt(term) {
        comando = "";
        cursorPos = 0;
        term.write("\r\n$ ");
      }

      function deleguaPrompt(terminal) {
        comando = "";
        cursorPos = 0;
        terminal.write("\r\ndelegua> ");
      }

      function ajudaPrompt(terminal) {
        comando = "";
        cursorPos = 0;
        terminal.write("\r\najuda> ");
      }

      // ─── Conteúdo de ajuda ───────────────────────────────────────────────────

      var conteudoAjuda = {
        'escreva': `
# escreva(valores...)

Escreve valores na saída padrão (console).

**Sintaxe:**
  escreva(valor1, valor2, ...)

**Parâmetros:**
  - valores: Um ou mais valores de qualquer tipo a serem impressos

**Retorno:**
  nulo

**Características:**
  - Aceita múltiplos argumentos separados por vírgula
  - Suporta interpolação de strings com \${variavel}
  - Converte automaticamente valores para texto

**Exemplos:**
  escreva(1)
  var nome = 'Maria'
  escreva(nome)
  escreva('Números:', 1, 2, 3)
`,
        'leia': `
# leia([mensagem])

Lê entrada do usuário a partir da entrada padrão.

**Sintaxe:**
  leia()
  leia(mensagem)

**Parâmetros:**
  - mensagem (opcional): Texto a ser exibido antes da leitura

**Retorno:**
  texto - Sempre retorna uma string

**Importante:**
  O retorno de leia() é SEMPRE do tipo texto. Para converter
  para outro tipo, use as funções de conversão (numero, inteiro, etc.)

**Exemplos:**
  var nome = leia()
  escreva('Olá, ' + nome)

  var idadeTexto = leia('Digite sua idade: ')
  var idade = inteiro(idadeTexto)
`,
        'numero': `

Converte um valor para número (ponto flutuante).

**Sintaxe:**

**Parâmetros:**

**Retorno:**
  número - Valor convertido para tipo numérico

**Sinônimos:**

**Exemplos:**
  var texto = '3.14'
  escreva(numero(texto))  // 3.14

  var n = 42
  escreva(numero(n))  // 42.0
`,

        'aleatorio': `

        'aleatorioEntre': `

Retorna um número inteiro aleatório entre dois valores.

**Sintaxe:**

        'mapear': `
# mapear(vetor, funcao)

Aplica uma função a cada elemento de um vetor e retorna novo vetor.

**Sintaxe:**

**Parâmetros:**

**Retorno:**
  vetor - Novo vetor com elementos transformados

**Exemplos:**

  var dobrados = mapear(numeros, funcao(x) { retorna x * 2 })
  escreva(dobrados)  // [2, 4, 6, 8]

        'filtrarPor': `

Filtra elementos de um vetor baseado em uma condição.

**Sintaxe:**

        'todosEmCondicao': `

      };

      function normalizarParaBusca(texto) {
        return texto.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      }

      function buscarConteudoAjuda(topico) {
        if (conteudoAjuda[topico]) return conteudoAjuda[topico];
        const norm = normalizarParaBusca(topico);
        for (const [chave, conteudo] of Object.entries(conteudoAjuda)) {
          if (normalizarParaBusca(chave) === norm) return conteudo;
        }
        return null;
      }

      function aplicarRealceSintaxeWeb(conteudo) {
        const PALAVRAS_CHAVE = new Set(['var', 'const', 'se', 'senao', 'senão', 'para', 'enquanto',
          'fazer', 'funcao', 'função', 'retorna', 'classe', 'herda', 'construtor', 'isto',
          'super', 'tente', 'pegue', 'finalmente', 'sustar', 'continua', 'escolha', 'caso',
          'padrao', 'padrão', 'importar', 'de', 'como']);
        const LITERAIS = new Set(['verdadeiro', 'falso', 'nulo']);
        const FUNCOES_NATIVAS = new Set(['escreva', 'leia', 'mapear', 'filtrarPor', 'ordenar',
          'paraCada', 'numero', 'número', 'inteiro', 'real', 'texto', 'tamanho', 'aleatorio',
          'aleatório', 'aleatorioEntre', 'clonar', 'tupla', 'todosEmCondicao', 'encontrar',
          'somar', 'maximo', 'máximo', 'minimo', 'mínimo']);

        function c(code, text) { return `\x1b[${code}m${text}\x1b[0m`; }

        function realcarLinha(linha) {
          let res = '', i = 0;
          while (i < linha.length) {
            if (linha.substring(i, i + 2) === '//') { res += c('90', linha.substring(i)); break; }
            if (linha[i] === '"') {
              let j = i + 1;
              while (j < linha.length) { if (linha[j] === '\\' && j + 1 < linha.length) { j += 2; continue; } if (linha[j] === '"') { j++; break; } j++; }
              res += c('32', linha.substring(i, j)); i = j; continue;
            }
            if (linha[i] === "'") {
              let j = i + 1;
              while (j < linha.length && linha[j] !== "'") { if (linha[j] === '\\') j++; j++; }
              res += c('32', linha.substring(i, j + 1)); i = j + 1; continue;
            }
            if (/\d/.test(linha[i])) {
              let j = i;
              while (j < linha.length && /[\d.]/.test(linha[j])) j++;
              res += c('36', linha.substring(i, j)); i = j; continue;
            }
            if (/[a-záàâãéêíóôõúçA-ZÁÀÂÃÉÊÍÓÔÕÚÇ_]/.test(linha[i])) {
              let j = i;
              while (j < linha.length && /[a-záàâãéêíóôõúçA-ZÁÀÂÃÉÊÍÓÔÕÚÇ0-9_]/.test(linha[j])) j++;
              const w = linha.substring(i, j);
              if (PALAVRAS_CHAVE.has(w)) res += c('35', w);
              else if (LITERAIS.has(w)) res += c('33', w);
              else if (FUNCOES_NATIVAS.has(w)) res += c('34', w);
              else res += w;
              i = j; continue;
            }
            if ('(){}[]'.includes(linha[i])) { res += c('33', linha[i]); i++; continue; }
            res += linha[i]; i++;
          }
          return res;
        }

        function realcarInline(texto) {
          return texto
            .replace(/`([^`]+)`/g, (_, g) => c('33', g))
            .replace(/\*\*([^*]+)\*\*/g, (_, g) => c('1;37', g))
            .replace(/\*([^*]+)\*/g, (_, g) => c('3', g));
        }

        function realcarMarkdown(linha) {
          if (linha.trim() === '') return linha;
          if (/^\s*---\s*$/.test(linha)) return c('90', linha);
          const tm = linha.match(/^(#{1,6})\s+(.*)$/);
          if (tm) return `${c('36;1', tm[1])} ${c('36;1', tm[2])}`;
          const lm = linha.match(/^\s*([-*])\s+(.*)$/);
          if (lm) return `${c('33', lm[1])} ${realcarInline(lm[2])}`;
          return realcarInline(linha);
        }

        const linhas = conteudo.split('\n');
        const resultado = [];
        let emExemplo = false;
        for (const linha of linhas) {
          if (linha.includes('**Exemplos:**') || linha.includes('**Exemplo:**')) {
            emExemplo = true; resultado.push(realcarMarkdown(linha)); continue;
          }
          if (emExemplo && linha.includes('**') && !linha.includes('Exemplo')) emExemplo = false;
          if (emExemplo && /^  [^ ]/.test(linha)) {
            const indent = linha.match(/^(\s*)/)[1];
            resultado.push(indent + realcarLinha(linha.trimStart()));
          } else {
            resultado.push(realcarMarkdown(linha));
          }
        }
        return resultado.join('\n');
      }

      function exibirBoasVindasAjuda(terminal) {
        const sep = '\x1b[36;1m' + '═'.repeat(63) + '\x1b[0m';
        terminal.writeln([
          '',
          sep,
          '\x1b[1mBem-vindo ao sistema de ajuda de Delégua!\x1b[0m',
          sep,
          '',
          'Este é um utilitário de ajuda interativo.',
          '',
          'Digite o nome de qualquer \x1b[33mfunção\x1b[0m, \x1b[33mpalavra-chave\x1b[0m ou \x1b[33mtópico\x1b[0m',
          'para obter ajuda sobre esse item.',
          '',
          '\x1b[1mComandos disponíveis:\x1b[0m',
          '  \x1b[32mtópicos\x1b[0m  - Lista todos os tópicos disponíveis',
          '  \x1b[32msair\x1b[0m     - Sai do modo de ajuda',
          '',
          '\x1b[2mExemplo: digite "escreva" para ver a ajuda sobre escreva()\x1b[0m',
          '',
        ].join('\r\n'));
      }

      function listarTopicosAjuda(terminal) {
        const categorias = {
          'Entrada/Saída': ['escreva', 'leia'],
          'Conversão de Tipos': ['numero', 'número', 'inteiro', 'real', 'texto'],
          'Aleatoriedade': ['aleatorio', 'aleatório', 'aleatorioEntre'],
          'Funções de Vetor': ['mapear', 'filtrarPor', 'ordenar', 'paraCada', 'tamanho',
            'todosEmCondicao', 'encontrar', 'clonar', 'tupla'],
          'Palavras-Chave': ['var', 'const', 'se', 'senao', 'para', 'enquanto', 'fazer',
            'funcao', 'retorna', 'verdadeiro', 'falso', 'nulo'],
        };
        let linhas = ['\r\n\x1b[1mTópicos de Ajuda Disponíveis:\x1b[0m'];
        for (const [cat, topicos] of Object.entries(categorias)) {
          const disponiveis = topicos.filter(t => buscarConteudoAjuda(t));
          if (disponiveis.length > 0) {
            linhas.push('\r\n\x1b[33m' + cat + ':\x1b[0m');
            linhas.push('  ' + disponiveis.join(', '));
          }
        }
        linhas.push('\r\n\x1b[2mDigite o nome de qualquer tópico para ver mais informações.\x1b[0m');
        terminal.writeln(linhas.join('\r\n'));
      }

      function executarComandoAjuda(terminal, linha) {
        const entrada = linha.trim();
        if (!entrada) {
          exibirBoasVindasAjuda(terminal);
          ajudaPrompt(terminal);
          return;
        }
        const norm = normalizarParaBusca(entrada);
        if (norm === 'sair') {
          modoAjuda = false;
          terminal.writeln('\r\n\x1b[2mSaindo do modo de ajuda...\x1b[0m');
          deleguaPrompt(terminal);
          return;
        }
        if (norm === 'topicos' || norm === 'tópicos') {
          listarTopicosAjuda(terminal);
          ajudaPrompt(terminal);
          return;
        }
        const conteudo = buscarConteudoAjuda(entrada);
        if (conteudo) {
          terminal.write(aplicarRealceSintaxeWeb(conteudo).replace(/\n/g, '\r\n'));
        } else {
          terminal.writeln('\r\n\x1b[31mNenhuma ajuda disponível para "' + entrada + '".\x1b[0m');
          terminal.writeln('\x1b[2mDigite \x1b[32mtópicos\x1b[0m\x1b[2m para ver os tópicos disponíveis.\x1b[0m');
        }
        ajudaPrompt(terminal);
      }

      var comandos = {
        ajuda: {
          f: () => {
            const padding = 10;
            function formatMessage(name, descricao) {
              const maxLength = term.cols - padding - 3;
              let remaining = descricao;
              const d = [];
              while (remaining.length > 0) {
                // Trim any spaces left over from the previous line
                remaining = remaining.trimStart();
                // Check if the remaining text fits
                if (remaining.length < maxLength) {
                  d.push(remaining);
                  remaining = "";
                } else {
                  let splitIndex = -1;
                  // Check if the remaining line wraps already
                  if (remaining[maxLength] === " ") {
                    splitIndex = maxLength;
                  } else {
                    // Find the last space to use as the split index
                    for (let i = maxLength - 1; i >= 0; i--) {
                      if (remaining[i] === " ") {
                        splitIndex = i;
                        break;
                      }
                    }
                  }
                  d.push(remaining.substring(0, splitIndex));
                  remaining = remaining.substring(splitIndex);
                }
              }
              const message =
                `  \x1b[36;1m${name.padEnd(padding)}\x1b[0m ${d[0]}` +
                d.slice(1).map((e) => `\r\n  ${" ".repeat(padding)} ${e}`);
              return message;
            }
            term.writeln(
              [
                "Nossas boas-vindas à simulação de terminal Delégua na Web! Experimente alguns dos comandos abaixo.",
                "",
                ...Object.keys(comandos).map((e) =>
                  formatMessage(e, comandos[e].descricao)
                ),
              ].join("\n\r")
            );
            terminalPrompt(term);
          },
          descricao: "Imprime esta mensagem de ajuda.",
        },
        delegua: {
          descricao: "Inicia o modo LAIR (Leia-Avalie-Imprima-Repita) da linguagem Delégua",
          f: () => {
            modoDelegua = true;
            term.write(`Console da Linguagem Delégua v1.2.2\r\n`);
            term.write("Pressione Ctrl + C para sair\r\n");
            deleguaPrompt(term);
          }
        },
        limpar: {
          descricao: "Limpa a tela do terminal.",
          f: () => {
            term.reset();
            terminalPrompt(term);
          }
        }
      };

      function executarComando(terminal, text) {
        const comando = text.trim().split(" ")[0];
        if (comando.length > 0) {
          terminal.writeln("");
          if (comando in comandos) {
            comandos[comando].f();
            return;
          }

          terminal.writeln(`${comando}: comando não encontrado.`);
        }

        terminalPrompt(terminal);
      }

      term.prompt = () => {
        term.write("\r\n$ ");
      };

      term.onData((e) => {
        switch (e) {
          case "": // Ctrl+C
            if (modoAjuda) {
              modoAjuda = false;
              term.write("^C");
              deleguaPrompt(term);
            } else if (modoDelegua) {
              modoDelegua = false;
              term.write("^C");
              terminalPrompt(term);
            } else {
              term.write("^C");
              terminalPrompt(term);
            }
            break;
          case "\r": // Enter
            if (modoAjuda) {
              term.write("\r\n");
              executarComandoAjuda(term, comando);
            } else if (modoDelegua) {
              term.write("\r\n");
              if (comandoLeia) {
                comandoLeia = false;
                resultadoLeia = comando; // Preciso fazer isso porque o callback da leitura é executado depois que `comando` é limpo.
                promessaLeitura.notify();
              } else {
                executarInstrucaoDelegua(term, comando);
              }
            } else {
              executarComando(term, comando);
            }

            comando = "";
            cursorPos = 0;
            break;
          case "": // Backspace (DEL)
            if (cursorPos > 0) {
              const tail = comando.slice(cursorPos);
              comando = comando.slice(0, cursorPos - 1) + tail;
              cursorPos--;
              if (tail.length === 0) {
                term.write("\b \b");
              } else {
                term.write("\b" + tail + " \x1b[" + (tail.length + 1) + "D");
              }
            }
            break;
          case "\x1b[D": // Seta esquerda
            if (cursorPos > 0) {
              cursorPos--;
              term.write("\x1b[D");
            }
            break;
          case "\x1b[C": // Seta direita
            if (cursorPos < comando.length) {
              cursorPos++;
              term.write("\x1b[C");
            }
            break;
          default: // Caso geral: imprimir todos os caracteres.
            if (
              (e >= String.fromCharCode(0x20) &&
                e <= String.fromCharCode(0x7e)) ||
              e >= " "
            ) {
              if (cursorPos === comando.length) {
                comando += e;
                term.write(e);
              } else {
                comando = comando.slice(0, cursorPos) + e + comando.slice(cursorPos);
                const tail = comando.slice(cursorPos + 1);
                term.write(e + tail + "\x1b[" + tail.length + "D");
              }
              cursorPos++;
            }
        }
      });

      term.writeln(
        [
          "    Este é o terminal online da Design Líquido. Por ele, você pode experimentar nossas",
          "     linguagens de programação, como \x1b[3mDelégua\x1b[0m e \x1b[3mPituguês\x1b[0m!",
          "",
          "",
        ].join("\n\r")
      );

      term.writeln("Experimente digitar `ajuda`.");
      terminalPrompt(term);
    </script>
  </body>
</html>
