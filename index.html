<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="/css/estilos.css" />

    <script src="node_modules/@designliquido/delegua/umd/delegua.js"></script>
    <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="/js/comandos.js"></script>
    <script src="/js/await-notify.js"></script>
  </head>
  <body>
    <div id="terminal"></div>
    <script>
      var term = new Terminal({
        rows: 50,
        fontFamily: '"Cascadia Code", Menlo, monospace',
        allowProposedApi: true,
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);

      const delegua = window.Delegua;
      var comando = "";
      var cursorPos = 0;
      var resultadoLeia = "";
      var modoDelegua = false;
      var comandoLeia = false;
      var promessaLeitura = new window.Subject();

      const lexador = new delegua.Lexador();
      const avaliadorSintatico = new delegua.AvaliadorSintatico();
      const interpretador = new delegua.InterpretadorBase('', false, (t) => term.write(t + "\r\n"), (t) => term.write(t));
      interpretador.interfaceEntradaSaida = {
        question: (mensagem, callback) => {
          comandoLeia = true;
          term.write(mensagem);
          promessaLeitura.wait().then(_ => {
            const copiaResultadoLeia = resultadoLeia;
            resultadoLeia = "";
            callback(copiaResultadoLeia);
          });
        }
      }

      // Persist parser scope across LAIR calls so variables declared in one line
      // are visible to the parser in subsequent lines.
      const escopoSintaticoPersistente = {};
      const _inicializarPilhaOriginal = avaliadorSintatico.inicializarPilhaEscopos.bind(avaliadorSintatico);
      avaliadorSintatico.inicializarPilhaEscopos = function() {
        _inicializarPilhaOriginal();
        for (const [nome, info] of Object.entries(escopoSintaticoPersistente)) {
          this.pilhaEscopos.definirInformacoesVariavel(nome, info);
        }
      };

      async function executarInstrucaoDelegua(terminal, linha) {
        const resultadoLexador = lexador.mapear([linha], -1);
        const resultadoAvaliacaoSintatica = await avaliadorSintatico.analisar(resultadoLexador);
        if (resultadoAvaliacaoSintatica.erros.length > 0) {
          for (const erro of resultadoAvaliacaoSintatica.erros) {
            terminal.write((erro.erroInterno?.message ?? String(erro)) + "\r\n");
          }
          deleguaPrompt(terminal);
          return;
        }
        // Save parser scope so future LAIR lines see variables declared here.
        if (avaliadorSintatico.pilhaEscopos?.pilha?.length > 0) {
          Object.assign(escopoSintaticoPersistente, avaliadorSintatico.pilhaEscopos.pilha[0].elementosSintaticos);
        }
        interpretador.interpretar(
          resultadoAvaliacaoSintatica.declaracoes,
          true
        ).then(retornoInterpretador => {
          if (retornoInterpretador.erros.length > 0) {
            for (const erro of retornoInterpretador.erros) {
              terminal.write((erro.erroInterno?.message ?? String(erro.erroInterno)) + "\r\n");
            }
          } else if (retornoInterpretador.resultado.length > 0) {
            const primeiroResultado = retornoInterpretador.resultado[0];
            if (primeiroResultado?.tipo !== 'vazio') {
              const valor = primeiroResultado?.valorRetornado?.valor ?? primeiroResultado?.valor;
              if (valor !== undefined && valor !== null) {
                terminal.write(String(valor) + "\r\n");
              }
            }
          }

          deleguaPrompt(terminal);
        });
      }

      term.open(document.getElementById("terminal"));
      fitAddon.fit();

      function terminalPrompt(term) {
        comando = "";
        cursorPos = 0;
        term.write("\r\n$ ");
      }

      function deleguaPrompt(terminal) {
        comando = "";
        cursorPos = 0;
        terminal.write("\r\ndelegua> ");
      }

      var comandos = {
        ajuda: {
          f: () => {
            const padding = 10;
            function formatMessage(name, descricao) {
              const maxLength = term.cols - padding - 3;
              let remaining = descricao;
              const d = [];
              while (remaining.length > 0) {
                // Trim any spaces left over from the previous line
                remaining = remaining.trimStart();
                // Check if the remaining text fits
                if (remaining.length < maxLength) {
                  d.push(remaining);
                  remaining = "";
                } else {
                  let splitIndex = -1;
                  // Check if the remaining line wraps already
                  if (remaining[maxLength] === " ") {
                    splitIndex = maxLength;
                  } else {
                    // Find the last space to use as the split index
                    for (let i = maxLength - 1; i >= 0; i--) {
                      if (remaining[i] === " ") {
                        splitIndex = i;
                        break;
                      }
                    }
                  }
                  d.push(remaining.substring(0, splitIndex));
                  remaining = remaining.substring(splitIndex);
                }
              }
              const message =
                `  \x1b[36;1m${name.padEnd(padding)}\x1b[0m ${d[0]}` +
                d.slice(1).map((e) => `\r\n  ${" ".repeat(padding)} ${e}`);
              return message;
            }
            term.writeln(
              [
                "Nossas boas-vindas à simulação de terminal Delégua na Web! Experimente alguns dos comandos abaixo.",
                "",
                ...Object.keys(comandos).map((e) =>
                  formatMessage(e, comandos[e].descricao)
                ),
              ].join("\n\r")
            );
            terminalPrompt(term);
          },
          descricao: "Imprime esta mensagem de ajuda.",
        },
        delegua: {
          descricao: "Inicia o modo LAIR (Leia-Avalie-Imprima-Repita) da linguagem Delégua",
          f: () => {
            modoDelegua = true;
            term.write(`Console da Linguagem Delégua v1.2.2\r\n`);
            term.write("Pressione Ctrl + C para sair\r\n");
            deleguaPrompt(term);
          }
        },
        limpar: {
          descricao: "Limpa a tela do terminal.",
          f: () => {
            term.reset();
            terminalPrompt(term);
          }
        }
      };

      function executarComando(terminal, text) {
        const comando = text.trim().split(" ")[0];
        if (comando.length > 0) {
          terminal.writeln("");
          if (comando in comandos) {
            comandos[comando].f();
            return;
          }

          terminal.writeln(`${comando}: comando não encontrado.`);
        }

        terminalPrompt(terminal);
      }

      term.prompt = () => {
        term.write("\r\n$ ");
      };

      term.onData((e) => {
        switch (e) {
          case "": // Ctrl+C
            if (modoDelegua) {
              modoDelegua = false;
            }

            term.write("^C");
            terminalPrompt(term);
            break;
          case "\r": // Enter
            if (modoDelegua) {
              term.write("\r\n");
              if (comandoLeia) {
                comandoLeia = false;
                resultadoLeia = comando; // Preciso fazer isso porque o callback da leitura é executado depois que `comando` é limpo.
                promessaLeitura.notify();
              } else {
                executarInstrucaoDelegua(term, comando);
              }
            } else {
              executarComando(term, comando);
            }

            comando = "";
            cursorPos = 0;
            break;
          case "": // Backspace (DEL)
            if (cursorPos > 0) {
              const tail = comando.slice(cursorPos);
              comando = comando.slice(0, cursorPos - 1) + tail;
              cursorPos--;
              if (tail.length === 0) {
                term.write("\b \b");
              } else {
                term.write("\b" + tail + " \x1b[" + (tail.length + 1) + "D");
              }
            }
            break;
          case "\x1b[D": // Seta esquerda
            if (cursorPos > 0) {
              cursorPos--;
              term.write("\x1b[D");
            }
            break;
          case "\x1b[C": // Seta direita
            if (cursorPos < comando.length) {
              cursorPos++;
              term.write("\x1b[C");
            }
            break;
          default: // Caso geral: imprimir todos os caracteres.
            if (
              (e >= String.fromCharCode(0x20) &&
                e <= String.fromCharCode(0x7e)) ||
              e >= " "
            ) {
              if (cursorPos === comando.length) {
                comando += e;
                term.write(e);
              } else {
                comando = comando.slice(0, cursorPos) + e + comando.slice(cursorPos);
                const tail = comando.slice(cursorPos + 1);
                term.write(e + tail + "\x1b[" + tail.length + "D");
              }
              cursorPos++;
            }
        }
      });

      term.writeln(
        [
          "    Este é o terminal online da Design Líquido. Por ele, você pode experimentar nossas",
          "     linguagens de programação, como \x1b[3mDelégua\x1b[0m e \x1b[3mPituguês\x1b[0m!",
          "",
          "",
        ].join("\n\r")
      );

      term.writeln("Experimente digitar `ajuda`.");
      terminalPrompt(term);
    </script>
  </body>
</html>
